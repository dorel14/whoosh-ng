repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: check-ast
      - id: check-merge-conflict
      - id: check-toml
      - id: check-yaml
      - id: detect-private-key
      - id: end-of-file-fixer
      - id: mixed-line-ending
      - id: trailing-whitespace

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.11.0
    hooks:
      - id: ruff
        args: [--fix, --unsafe-fixes]
      - id: ruff-format

  - repo: https://github.com/pre-commit/mirrors-mypy
    rev: v1.16.1
    hooks:
      - id: mypy
        additional_dependencies: [cached-property>=2.0.1]
        files: ^src/

  - repo: https://github.com/RobertCraigie/pyright-python
    rev: v1.1.391
    hooks:
      - id: pyright
        files: ^src/

  - repo: local
    hooks:
      - id: sync-version
        name: Sync version from pyproject.toml
        entry: python scripts/sync_version.py
        language: system
        # Kept in pre-push (instead of pre-commit) to avoid blocking local
        # commits when version files are intentionally mid-update.
        pass_filenames: false
        files: ^(pyproject\.toml|README\.md|src/whoosh/__init__\.py)$
        stages: [pre-push]

# Never scan the CI pre-commit log artifact
exclude: '^precommit\.log$'
