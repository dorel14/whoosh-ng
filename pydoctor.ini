[pydoctor]
# Pydoctor configuration for Whoosh-NG API documentation generation.
#
# Pydoctor generates HTML API docs from Python source code, supporting
# Google-style docstrings (--docformat=google).
#
# Usage:
#   python scripts/generate_api_docs.py
#   pydoctor --config pydoctor.ini src/whoosh src/whoosh_modern

project-name=Whoosh-NG
project-url=https://github.com/dorel14/whoosh-ng
docformat=google
html-output=website/build/api
