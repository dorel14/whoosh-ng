---
# Jekyll configuration for GitHub Pages with Just the Docs theme

# Site settings
title: Whoosh-NG Documentation
description: Pure-Python full-text indexing and search library, modernized for 2025+
lang: en
timezone: UTC

# GitHub Pages: base URL (repo name for project pages)
baseurl: "/whoosh-ng"
#url: "https://dorel14.github.io"

# Build settings
markdown: kramdown
highlighter: rouge
permalink: pretty

# Use remote theme for Just the Docs (GitHub Pages compatible)
remote_theme: just-the-docs/just-the-docs

# Just the Docs theme configuration
just_the_docs:
  search_enabled: true
  search_preview: true
  heading_break: 360
  nav_sort: case_insensitive
  collections:
    en:
      name: English
      nav_fold: true
    fr:
      name: Français
      nav_fold: true
  nav:
    - Home: /
    - English:
        - Quick Start: /en/quickstart/
        - Installation: /en/guides/installation/
        - Core Concepts: /en/guides/core-concepts/
        - Indexing: /en/guides/indexing/
        - Searching: /en/guides/searching/
        - Schema Design: /en/guides/schema/
        - Query Language: /en/guides/query/
        - Middleware: /en/guides/middleware/
        - Backends: /en/guides/backends/
        - Plugins: /en/guides/plugins/
        - Autocomplete: /en/guides/autocomplete/
        - Vector Search: /en/guides/vector/
        - Monitoring: /en/guides/monitoring/
        - Migration: /en/guides/migration/
        - API Overview: /en/api/overview/
        - Core API: /en/api/core/
        - Fields: /en/api/fields/
        - Writing API: /en/api/writing/
        - Searching API: /en/api/searching/
        - Query API: /en/api/query/
        - Events: /en/api/events/
        - Middleware API: /en/api/middleware/
        - Plugins API: /en/api/plugins/
        - Backends API: /en/api/backends/
        - Modern API: /en/api/modern/
        - Examples: /en/examples/
    - Français:
        - Démarrage rapide: /fr/quickstart/
        - Installation: /fr/guides/installation/
  footer_content: "Whoosh-NG Documentation | Last updated: 2026-07-26"

# Collections for organized content
collections:
  en:
    output: true
    sort_by: nav_order
  fr:
    output: true
    sort_by: nav_order

# Site favicon and logo (served from docs/assets/)
favicon_ico: "/assets/favico.ico"
logo: "/assets/logo.png"

# Default front matter for markdown files
defaults:
  # Root pages (README.md, etc.)
  - scope:
      path: ""
      type: pages
    values:
      layout: default
  # Collection: English
  - scope:
      path: "_en"
      type: en
    values:
      layout: default
      lang: en
  # Collection: French
  - scope:
      path: "_fr"
      type: fr
    values:
      layout: default
      lang: fr

# Include additional files
include:
  - _pages
  - README.md

# Exclude from build
exclude:
  - archive/
  - .kilo/
  - .git/
  - node_modules/
  - vendor/
  - "*.py"
  - "*.json"
  - "*.yaml"
  - "*.yml"
  - ".env*"
  - "*.log"
  - "__pycache__/"
  - "*.egg-info/"
  - ".venv/"
  - "venv/"
  - Gemfile
  - Gemfile.lock

# Plugins (GitHub Pages supported)
plugins:
  - jekyll-remote-theme
  - jekyll-seo-tag
  - jekyll-sitemap
  - jekyll-feed

# SEO and social
github_username: dorel14
repository: whoosh-ng
