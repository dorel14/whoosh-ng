<svg xmlns="http://www.w3.org/2000/svg" width="800" height="600" viewBox="0 0 800 600" font-family=" -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif">
  <defs>
    <linearGradient id="grad-app" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#007bff"/>
      <stop offset="100%" stop-color="#0056b3"/>
    </linearGradient>
    <linearGradient id="grad-core" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#28a745"/>
      <stop offset="100%" stop-color="#1e7e34"/>
    </linearGradient>
    <linearGradient id="grad-plugin" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffc107"/>
      <stop offset="100%" stop-color="#d39e00"/>
    </linearGradient>
  </defs>

  <!-- Application layer -->
  <rect x="300" y="30" width="200" height="60" rx="8" fill="url(#grad-app)" stroke="#004085" stroke-width="2"/>
  <text x="400" y="65" text-anchor="middle" fill="white" font-size="16" font-weight="bold">Application</text>

  <!-- Arrow from app to core -->
  <line x1="400" y1="90" x2="400" y2="110" stroke="#6c757d" stroke-width="2" marker-end="url(#arrow)"/>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="5" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#6c757d"/>
    </marker>
  </defs>

  <!-- Core box -->
  <rect x="150" y="120" width="500" height="240" rx="8" fill="url(#grad-core)" stroke="#1e7e34" stroke-width="2"/>
  <text x="400" y="145" text-anchor="middle" fill="white" font-size="16" font-weight="bold">Whoosh-NG Core</text>

  <!-- Core components -->
  <g fill="white" font-size="13">
    <text x="200" y="175">Search Engine</text>
    <text x="200" y="195">Schema / Fields</text>
    <text x="200" y="215">Plugin Manager</text>
    <text x="200" y="235">Registry System</text>
    <text x="200" y="255">Middleware Pipeline</text>
    <text x="200" y="275">Event Bus</text>
    <text x="200" y="295">Hook System</text>
  </g>

  <!-- Arrow from core to plugins -->
  <line x1="400" y1="360" x2="400" y2="380" stroke="#6c757d" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Plugins box -->
  <rect x="150" y="380" width="500" height="160" rx="8" fill="url(#grad-plugin)" stroke="#d39e00" stroke-width="2"/>
  <text x="400" y="405" text-anchor="middle" fill="#212529" font-size="16" font-weight="bold">Plugins</text>

  <!-- Plugin items -->
  <g fill="#212529" font-size="13">
    <text x="200" y="430">FastAPI</text>
    <text x="350" y="430">Vector Search</text>
    <text x="500" y="430">Autocomplete</text>
    <text x="200" y="450">PostgreSQL</text>
    <text x="350" y="450">S3</text>
    <text x="500" y="450">Monitoring</text>
    <text x="350" y="470">Admin UI</text>
  </g>

  <text x="400" y="565" text-anchor="middle" fill="#6c757d" font-size="12">Data flows downward; middleware hooks intercept search and index operations</text>
</svg>
