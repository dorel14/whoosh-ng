name: Feature request
about: Suggest an idea for this project
title: '[Feature] '
labels:
  - enhancement
  - feature-request
  - needs-triage
body:
  - type: dropdown
    id: type
    attributes:
      label: Type
      description: What type of feature is this?
      options:
        - Feature
        - Enhancement
        - Documentation
    validations:
      required: true
  - type: textarea
    id: description
    attributes:
      label: Description
      description: Describe the feature and why it would be useful.
    validations:
      required: true
  - type: textarea
    id: motivation
    attributes:
      label: Motivation
      description: Why is this feature needed? What problem does it solve?
    validations:
      required: true
  - type: textarea
    id: solution
    attributes:
      label: Proposed solution
      description: Describe how you would like this feature to be implemented.
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Describe any alternative solutions or workarounds you've considered.
  - type: textarea
    id: additional
    attributes:
      label: Additional context
      description: Add any other context, mockups, or examples here.
