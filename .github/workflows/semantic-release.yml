---
name: Semantic Release

on:
  push:
    branches:
      - master
    paths:
      - "src/**"
  workflow_dispatch:
  workflow_run:
    workflows: ["CI", "Legacy Code Validation"]
    types:
      - completed

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    if: ${{ github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success' }}
    name: Release
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          token: ${{ secrets.GH_TOKEN }}

      - name: Skip if release commit
        id: skip
        run: |
          LAST_MSG=$(git log -1 --pretty=%B)
          if echo "$LAST_MSG" | grep -qE '^chore\(release\):'; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "Skipping: latest commit is a release commit"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
            echo "Proceeding: not a release commit"
          fi

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set up UV
        uses: astral-sh/setup-uv@v5

      - name: Install semantic-release
        run: uv pip install --system python-semantic-release

      - name: Determine release version
        id: version
        if: steps.skip.outputs.skip != 'true'
        run: |
          VERSION="$(python -m semantic_release version --print)"
          if [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+ ]]; then
            echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
            echo "Detected version: ${VERSION}"
          else
            echo "No release required: ${VERSION}"
          fi

      - name: Update docs & Release
        if: steps.version.outputs.version != '' && steps.skip.outputs.skip != 'true'
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
        run: |
          VERSION="${{ steps.version.outputs.version }}"

          # Mise à jour du README et des Markdown
           find docs/ -name "*.md" -not -path "docs/archive_jekyll/*" -exec sed -i -E \
             "s/whoosh-ng==(\{[Vv]ersion\}|[0-9.]+)/whoosh-ng==$VERSION/g" {} \;

          sed -i -E "s/whoosh-ng==(\{[Vv]ersion\}|[0-9.]+)/whoosh-ng==$VERSION/g" README.md

          # Mise à jour de docs/_config.yml (clé 'version:')
           if [ -f docs/archive_jekyll/_config.yml ]; then
             sed -i -E "s/^(v|V)ersion: .*/version: $VERSION/" docs/archive_jekyll/_config.yml
           fi

          # Configurer git et commiter les changements
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          # Lance la release VCS (commit + tag)
          python -m semantic_release version --vcs-release

      - name: Publish to PyPI
        if: steps.version.outputs.version != '' && steps.skip.outputs.skip != 'true'
        env:
          PYPI_TOKEN: ${{ secrets.PYPI_TOKEN }}
        run: |
          uv build
          uv publish --token "$PYPI_TOKEN"
