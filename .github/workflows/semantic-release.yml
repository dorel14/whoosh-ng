---
name: Semantic Release

on:
  workflow_dispatch:
  workflow_run:
    workflows: ["CI"]
    types:
      - completed

permissions:
  contents: read
  actions: read  # Required for workflow_run trigger

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    if: |
      github.event_name != 'workflow_run' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event_name == 'workflow_run')
    name: Release
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}
        # GH_TOKEN is a personal access token (PAT) with repo/contents:write scopes.
        # GITHUB_TOKEN is GitHub's built-in token with more limited permissions.
        # We use GH_TOKEN here because semantic-release needs to push tags and commits.

      # For workflow_run triggers: verify that src/ or pyproject.toml changed
      # in the commit that triggered CI. This prevents semantic-release from
      # running on docs-only or workflow-only changes.
      - name: Check if src changed (workflow_run only)
        if: github.event_name == 'workflow_run'
        id: src_check
        run: |
          HEAD_SHA="${{ github.event.workflow_run.head_sha }}"
          echo "Checking commit: $HEAD_SHA"
          CHANGED=$(git diff --name-only "${HEAD_SHA}~1" "$HEAD_SHA" 2>/dev/null || git diff --name-only "$HEAD_SHA" HEAD)
          if echo "$CHANGED" | grep -qE '^(src/|pyproject\.toml)'; then
            echo "src_changed=true" >> "$GITHUB_OUTPUT"
            echo "Source files changed — proceeding with release check"
          else
            echo "src_changed=false" >> "$GITHUB_OUTPUT"
            echo "No source changes — skipping release"
            echo "Changed files:"
            echo "$CHANGED"
          fi

      - name: Skip if release commit
        id: skip
        run: |
          LAST_MSG=$(git log -1 --pretty=%B)
          if echo "$LAST_MSG" | grep -qE '^chore\(release\):'; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "Skipping: latest commit is a release commit"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      # For workflow_run triggers: combine the release-commit skip with src check
      - name: Final skip decision (workflow_run only)
        if: github.event_name == 'workflow_run' && steps.skip.outputs.skip != 'true'
        id: skip_src
        run: |
          if [ "${{ steps.src_check.outputs.src_changed }}" != "true" ]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "Skipping: no src/ or pyproject.toml changes"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
            echo "Proceeding: source files changed"
          fi

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set up UV
        uses: astral-sh/setup-uv@v5

      - name: Install semantic-release and pydoctor
        run: uv pip install --system python-semantic-release pydoctor

      - name: Determine release version
        id: version
        if: steps.skip.outputs.skip != 'true' && steps.skip_src.outputs.skip != 'true'
        run: |
          VERSION="$(python -m semantic_release version --print)"
          if [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+ ]]; then
            echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
            echo "Detected version: ${VERSION}"
          else
            echo "No release required: ${VERSION}"
          fi

      - name: Should release?
        id: should_release
        run: |
          if [ "${{ steps.skip.outputs.skip }}" == "true" ]; then
            echo "should_release=false" >> "$GITHUB_OUTPUT"
            echo "Skipping: release commit detected"
          elif [ "${{ steps.skip_src.outputs.skip }}" == "true" ]; then
            echo "should_release=false" >> "$GITHUB_OUTPUT"
            echo "Skipping: no source changes in workflow_run"
          elif [ "${{ steps.version.outputs.version }}" == "" ]; then
            echo "should_release=false" >> "$GITHUB_OUTPUT"
            echo "Skipping: no version detected"
          else
            echo "should_release=true" >> "$GITHUB_OUTPUT"
            echo "Proceeding with release ${{ steps.version.outputs.version }}"
          fi

      - name: Update docs & Release
        if: steps.should_release.outputs.should_release == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION="${{ steps.version.outputs.version }}"

          # Mise à jour du README et des Markdown
           find docs/ -name "*.md" -not -path "docs/archive_jekyll/*" -exec sed -i -E \
             "s/whoosh-ng==(\{[Vv]ersion\}|[0-9.]+)/whoosh-ng==$VERSION/g" {} \;

          sed -i -E "s/whoosh-ng==(\{[Vv]ersion\}|[0-9.]+)/whoosh-ng==$VERSION/g" README.md

          # Mise à jour de docs/_config.yml (clé 'version:')
           if [ -f docs/archive_jekyll/_config.yml ]; then
             sed -i -E "s/^(v|V)ersion: .*/version: $VERSION/" docs/archive_jekyll/_config.yml
           fi

          # Configurer git et commiter les changements
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          # Lance la release VCS (commit + tag)
          python -m semantic_release version --vcs-release

      - name: Publish to PyPI
        if: steps.should_release.outputs.should_release == 'true'
        env:
          PYPI_TOKEN: ${{ secrets.PYPI_TOKEN }}
        run: |
          set -e
          uv build
          # Check if version already exists on PyPI to prevent 400 errors
          VERSION="${{ steps.version.outputs.version }}"
          EXISTS=$(curl -s -o /dev/null -w "%{http_code}" https://pypi.org/pypi/whoosh-ng/$VERSION/json)
          if [ "$EXISTS" == "200" ]; then
            echo "Version $VERSION already exists on PyPI — skipping publish"
            exit 0
          fi
          echo "Publishing version $VERSION to PyPI..."
          uv publish --token "$PYPI_TOKEN"

      - name: Sync version strings
        if: steps.should_release.outputs.should_release == 'true'
        run: python scripts/sync_version.py

      - name: Generate changelog and docs
        if: steps.should_release.outputs.should_release == 'true'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python scripts/generate_changelog.py
          python scripts/generate_api_docs.py
          python scripts/generate_llm_docs.py

      - name: Commit changelog and docs updates
        if: steps.should_release.outputs.should_release == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          # Core docs
          git add website/docs/core/changelog.md
          git add website/docs/api/reference.md
          git add website/static/llms.txt website/static/llms-full.txt

          # Discover i18n translations dynamically
          LANG_DIRS=$(find website/i18n -mindepth 1 -maxdepth 1 -type d -printf '%f ')
          for lang in $LANG_DIRS; do
            git add "website/i18n/$lang/docusaurus-plugin-content-docs/current/core/changelog.md" || true
            git add "website/i18n/$lang/docusaurus-plugin-content-docs/current/api/reference.md" || true
          done

          git diff --quiet && git diff --staged --quiet || (git commit -m "docs: update changelog and API docs [skip ci]" && git push)

      - name: Trigger Pages deployment
        if: steps.should_release.outputs.should_release == 'true'
        run: |
          curl -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" \
            https://api.github.com/repos/${{ github.repository }}/dispatches \
            -d '{"event_type":"deploy-pages"}'
