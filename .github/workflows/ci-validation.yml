name: Legacy Code Validation
on: [push, pull_request]

permissions:
  contents: read

jobs:
  validate:
    runs-on: windows-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.9'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install .
          pip install coverage pytest

      - name: Run tests with coverage
        run: |
          coverage run -m pytest
          coverage report

      - name: Enforce 70% coverage threshold
        run: coverage report --fail-under=70

      - name: Generate exclusion documentation
        run: |
          echo "# Coverage Exclusion Documentation" > EXCLUSIONS.md
          echo "" >> EXCLUSIONS.md
          echo "This document outlines the patterns excluded from coverage measurement." >> EXCLUSIONS.md
          echo "" >> EXCLUSIONS.md
          echo "## Configuration Source" >> EXCLUSIONS.md
          echo "Exclusion patterns are defined in `.coveragerc` or `pyproject.toml` under `[tool:coverage:run]`." >> EXCLUSIONS.md
          echo "" >> EXCLUSIONS.md
          echo "## Common Exclusions" >> EXCLUSIONS.md
          echo "- `__init__.py` files" >> EXCLUSIONS.md
          echo "- Test directories (`tests/`, `test_*`) ## Adjust based on project structure" >> EXCLUSIONS.md
          echo "- Legacy/deprecated modules (if any)" >> EXCLUSIONS.md
          echo "- Third-party integrations" >> EXCLUSIONS.md
          echo "" >> EXCLUSIONS.md
          echo "## CI Validation" >> EXCLUSIONS.md
          echo "The CI workflow enforces a minimum coverage threshold of 70% on non-excluded code." >> EXCLUSIONS.md
          echo "See the coverage report for detailed breakdown." >> EXCLUSIONS.md

      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: htmlcov
          retention-days: 7