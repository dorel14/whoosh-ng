name: Update LLM Context Files

on:
  push:
    branches: [ dev ]
    paths:
      - 'docs/**'
      - 'website/docs/**'
      - 'website/i18n/**'
      - 'README.md'
      - '.github/workflows/llms-doc.yml'

jobs:
  generate-llm-data:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Generate llms.txt / llms-full.txt
        run: python scripts/generate_llm_docs.py

      - name: Deploy LLM files
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          # Root-level files (for direct repo consumption)
          cp llms.txt docs/llms.txt
          cp llms-full.txt docs/llms-full.txt
          git add llms.txt llms-full.txt docs/llms.txt docs/llms-full.txt website/static/llms.txt website/static/llms-full.txt
          git diff --quiet && git diff --staged --quiet || (git commit -m "docs: auto-update llms context files [skip ci]" && git push origin dev)
