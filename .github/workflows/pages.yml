name: Deploy GitHub Pages

# Build and deploy the Docusaurus site (source: website/) as the LAST step
# after Changelog Generation has completed. This ensures the deployed site
# always has the latest version number (from Semantic Release + Sync Version)
# and changelog entries (from Generate Changelog).
#
# Workflow chain on master:
#   1. Semantic Release  → version bump, commit, tag → pushes to master
#   2. Sync Version       → syncs version strings → pushes to master
#   3. Generate Changelog → generates changelog + API docs → pushes to master
#   4. Deploy GitHub Pages  → builds & deploys (this workflow, runs LAST)
#
# Primary trigger: workflow_run on "Generate Changelog" completion.
#
# Fallback: push to master for docs-only changes, but IGNORES commits from
# github-actions[bot] to prevent race conditions with the release chain.
# If a bot commit (from sync-version or changelog) is the latest, the
# workflow_run trigger will handle deployment instead.
on:
  workflow_run:
    workflows: ["Generate Changelog"]
    types:
      - completed
  push:
    branches: [master]
    paths-ignore:
      - "src/**"
      - "pyproject.toml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  # Cancel in-progress deploys when a newer deploy is queued.
  # This prevents stale builds from overwriting newer ones.
  cancel-in-progress: true

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    # For workflow_run: only deploy if the triggering workflow succeeded.
    # For push: skip if the push was from github-actions[bot] (i.e., from
    # sync-version.yml or changelog.yml), since the workflow_run trigger
    # already handles those cases.
    if: |
      (github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success') ||
      (github.event_name == 'push' && github.actor != 'github-actions[bot]')
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: website/package-lock.json

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install pydoctor
        run: pip install pydoctor

      - name: Generate API docs (safety net — changelog.yml also runs this)
        run: python scripts/generate_api_docs.py

      - name: Generate llms.txt (safety net — changelog.yml also runs this)
        run: python scripts/generate_llm_docs.py

      - name: Install dependencies
        working-directory: ./website
        run: npm ci

      - name: Build
        working-directory: ./website
        run: npm run build

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./website/build
          include-hidden-files: true

  deploy:
    name: Deploy
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
