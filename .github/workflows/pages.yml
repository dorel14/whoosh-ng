name: Deploy GitHub Pages

# Build and deploy the Docusaurus site as the LAST step after changelog
# generation has completed.
#
# Workflow chain on master:
#   1. Semantic Release → version bump + tag → pushes to master
#   2. Sync Version → syncs version strings → pushes to master
#   3. Generate Changelog → changelog + API docs → pushes to master
#   4. Deploy GitHub Pages (this workflow) → builds & deploys LAST
#
# Triggers:
#   - workflow_run on "Generate Changelog" completion (primary — ensures
#     deployment happens after all version sync + changelog generation)
#   - push to master (fallback — catches bot commits from sync-version.yml
#     and changelog.yml; the fetch-depth: 0 checkout ensures the latest
#     master state is used)
on:
  workflow_run:
    workflows: ["Generate Changelog"]
    types:
      - completed
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    # For workflow_run: only proceed if the triggering workflow succeeded.
    # For push: always proceed (the concurrency group prevents overlapping
    # deploys, and the checkout fetch-depth: 0 ensures we get the latest
    # master state including any bot commits from the release chain).
    if: |
      (github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success') ||
      (github.event_name == 'push') ||
      (github.event_name == 'workflow_dispatch')
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: website/package-lock.json

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install pydoctor
        run: pip install pydoctor

      - name: Generate API docs (safety net — changelog.yml also runs this)
        run: python scripts/generate_api_docs.py

      - name: Generate llms.txt (safety net — changelog.yml also runs this)
        run: python scripts/generate_llm_docs.py

      - name: Install dependencies
        working-directory: ./website
        run: npm ci

      - name: Build
        working-directory: ./website
        run: npm run build

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./website/build
          include-hidden-files: true

  deploy:
    name: Deploy
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
