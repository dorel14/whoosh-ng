name: Deploy GitHub Pages

# Build and deploy the Docusaurus site as the LAST step after changelog
# generation has completed.
#
# Workflow chain on master:
#   1. CI completes on dev PR or dev push
#   2. Semantic Release (unified) → version bump + tag + sync + changelog + API docs + llms → pushes to master
#   3. Deploy GitHub Pages (this workflow) → builds & deploys LAST
#
# Triggers:
#   - repository_dispatch from "Semantic Release" (primary — the release
#     workflow explicitly dispatches this event when it finishes, ensuring
#     Pages deploys after all version sync + changelog generation)
#   - workflow_dispatch (manual trigger for debugging)
on:
  repository_dispatch:
    types: [deploy-pages]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: website/package-lock.json

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install pydoctor
        run: pip install pydoctor

      - name: Generate API docs
        run: python scripts/generate_api_docs.py

      - name: Generate llms.txt
        run: python scripts/generate_llm_docs.py

      - name: Install dependencies
        working-directory: ./website
        run: npm ci

      - name: Build
        working-directory: ./website
        run: npm run build

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./website/build
          include-hidden-files: true

  deploy:
    name: Deploy
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
