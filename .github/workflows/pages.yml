name: Deploy GitHub Pages

# Build and deploy the Docusaurus site as the LAST step after changelog
# generation has completed.
#
# Workflow chain on master:
#   1. Semantic Release → version bump + tag → pushes to master
#   2. Sync Version → syncs version strings → pushes to master
#   3. Generate Changelog → changelog + API docs → pushes to master
#   4. Deploy GitHub Pages (this workflow) → builds & deploys LAST
#
# Triggers:
#   - workflow_run on "Generate Changelog" completion (handles release
#     chain: waits for all version sync + changelog generation)
#   - push to master for docs-only changes (skips bot commits — those
#     are handled by the workflow_run trigger above)
on:
  workflow_run:
    workflows: ["Generate Changelog"]
    types:
      - completed
  push:
    branches: [master]
    paths-ignore:
      - "src/**"
      - "pyproject.toml"
      - "docs/archive_jekyll/**"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    # For workflow_run: only proceed if the triggering workflow succeeded.
    # For push: skip if the push was from github-actions[bot] (i.e., from
    # sync-version.yml or changelog.yml — those are handled by the
    # workflow_run trigger which fires after Generate Changelog completes).
    if: |
      (github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success') ||
      (github.event_name == 'push' && github.actor != 'github-actions[bot]') ||
      (github.event_name == 'workflow_dispatch')
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: website/package-lock.json

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install pydoctor
        run: pip install pydoctor

      - name: Generate API docs (safety net — changelog.yml also runs this)
        run: python scripts/generate_api_docs.py

      - name: Generate llms.txt (safety net — changelog.yml also runs this)
        run: python scripts/generate_llm_docs.py

      - name: Install dependencies
        working-directory: ./website
        run: npm ci

      - name: Build
        working-directory: ./website
        run: npm run build

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./website/build
          include-hidden-files: true

  deploy:
    name: Deploy
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
