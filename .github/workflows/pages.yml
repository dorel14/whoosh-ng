name: Deploy GitHub Pages

# Build and deploy the Jekyll site (source: docs/) on every push to master
on:
  push:
    branches:
      - master
  workflow_dispatch: # Manual trigger for re-runs / debugging

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

env:
  JEKYLL_ENV: production
  # Project Pages are served at https://dorel14.github.io/whoosh-ng
  BASE_URL: /whoosh-ng
  # The Gemfile lives in docs/, not the repo root. Point Bundler at it so
  # `bundle install` (setup-ruby caching) and `bundle exec jekyll build`
  # can locate it when run from the repository root.
  BUNDLE_GEMFILE: ${{ github.workspace }}/docs/Gemfile

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3'
          bundler-cache: true # Caches gems between runs (uses docs/Gemfile.lock)

      - name: Setup Pages
        uses: actions/configure-pages@v5
        with:
          base_url: ${{ env.BASE_URL }}

      - name: Build with Jekyll
        run: bundle exec jekyll build --source docs --destination _site

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./_site
          # Include hidden files like .nojekyll for Jekyll-built sites without one
          include-hidden-files: true

  deploy:
    name: Deploy
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
