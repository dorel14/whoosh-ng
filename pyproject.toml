[tool.ruff.format]
indent-style = "space"
line-ending = "lf"
quote-style = "double"

[tool.mypy]
python_version = "3.12"
mypy_path = "src"
show_column_numbers = true
show_error_context = true
pretty = true
error_summary = true
follow_imports = "normal"
warn_unused_configs = true
warn_redundant_casts = true
warn_unused_ignores = true
strict_optional = true
no_implicit_optional = true
check_untyped_defs = true
disallow_untyped_decorators = true
warn_return_any = true
disable_error_code = ["attr-defined"]
cache_dir = ".mypy_cache"

[[tool.mypy.overrides]]
module = [
  "whoosh.support.pyparsing",
  "whoosh.lang.wordnet",
]
disable_error_code = ["assignment", "attr-defined", "no-redef", "union-attr"]

[[tool.mypy.overrides]]
module = "requests"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = [
  "pydantic",
  "msgspec",
  "sqlalchemy",
  "sqlalchemy.orm",
  "sqlmodel",
  "fastapi",
  "fastapi.responses",
  "numpy",
  "pandas",
  "polars",
  "pyarrow",
