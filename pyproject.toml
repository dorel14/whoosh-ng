# Reference: https://packaging.python.org/en/latest/specifications/declaring-project-metadata/
[build-system]
requires = ["setuptools>=75.3", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "whoosh-ng"
version = "2.0.0"
description = "Fast, pure-Python full-text indexing, search, and spell checking library."
readme = "README.md"
requires-python = ">=3.11"
license = "BSD-2-Clause"
authors = [
  { name = "David Orel", email = "d.orel@free.fr" },
]
maintainers = [
  { name = "dorel14", email = "d.orel@free.fr" },
]
keywords = ["index", "search", "text", "spell", "whoosh"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "Operating System :: OS Independent",
  "Programming Language :: Python",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Programming Language :: Python :: 3 :: Only",
  "Topic :: Software Development :: Libraries :: Python Modules",
  "Topic :: Text Processing :: Indexing",
  "Topic :: Text Processing :: Linguistic",
]
dependencies = [
  "cached-property>=2.0.1",
]

[project.optional-dependencies]
models = [
  "pydantic>=2",
  "msgspec>=0.19",
  "sqlalchemy>=2",
  "sqlmodel>=0.0.16",
  ]
vector = [
  "numpy>=2",
]
hnsw = [
  "hnswlib",
]
faiss = [
  "faiss-cpu",
]
embeddings = [
  "sentence-transformers",
]
fastembed = [
  "fastembed",
]
async = []
sqlite = []
postgres = [
  "psycopg[binary]>=3",
  "asyncpg",
]
s3 = [
  "boto3",
]
watch = [
  "watchdog",
]
fuzzy = [
  "rapidfuzz",
]
phonetic = [
  "metaphone",
]
lmdb = [
  "lmdb",
]
api = [
  "fastapi",
  "uvicorn[standard]",
  "orjson",
]
metrics = [
  "prometheus-client",
]
dev = [
  "ruff>=0.11",
  "mypy>=1.15",
  "pyright>=1.1",
  "pytest>=9",
  "pytest-cov>=6",
  "pytest-asyncio>=1",
  "pre-commit>=4",
  "build>=1.2",
  "twine>=6",
  "python-semantic-release>=10.5",
  "isort>=8.0.1",
  "pre-commit>=4.6.0",
]
benchmark = [
  "pytest-benchmark>=4",
]
profiling = [
  "psutil",
  "re2",
  "pystemmer",
]
fast-stemming = [
  "pystemmer",
]

[project.entry-points."whoosh_ng.plugins"]
whoosh_autocomplete = "whoosh_modern.autocomplete.plugin:AutocompletePlugin"
whoosh_vector = "whoosh_modern.vector.plugin:VectorPlugin"
whoosh_fastapi = "whoosh_fastapi:create_app"
whoosh_observability = "whoosh.middleware.metrics:PrometheusMiddleware"
whoosh_admin = "whoosh_admin:create_admin_app"

[project.urls]
Documentation = "https://dorel14.github.io/whoosh-ng/"
Homepage = "https://github.com/dorel14/whoosh-ng"
Issues = "https://github.com/dorel14/whoosh-ng/issues"
Repository = "https://github.com/dorel14/whoosh-ng.git"
Changelog = "https://github.com/dorel14/whoosh-ng/releases"

[tool.setuptools]
include-package-data = true
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
whoosh = ["py.typed"]

[tool.ruff]
target-version = "py311"
line-length = 100
force-exclude = true
output-format = "grouped"
show-fixes = true
src = ["src", "tests"]
exclude = [
  ".git",
  ".hg",
  ".mypy_cache",
  ".pytest_cache",
  ".ruff_cache",
  ".tox",
  ".venv",
  ".kilo",
  "build",
  "dist",
  "docs/build",
  "htmlcov",
]

[tool.ruff.lint]
select = [
  "E",
  "F",
  "I",
  "N",
  "UP",
  "B",
  "SIM",
  "PT",
  "TID",
  "Q",
]
ignore = [
  "E402",
  "F401",
  "F811",
  "F841",
]

[tool.ruff.lint.mccabe]
max-complexity = 45

[tool.ruff.lint.isort]
known-first-party = ["whoosh", "whoosh_modern", "whoosh_fastapi", "whoosh_admin"]

