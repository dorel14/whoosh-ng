ignore_errors = true

[tool.pytest.ini_options]
addopts = [
  "-ra",
  "--tb=short",
  "--cov=whoosh",
  "--cov=whoosh_modern",
  "--cov=whoosh_fastapi",
  "--cov=whoosh_admin",
  "--cov-report=term",
  "--cov-report=html:htmlcov",
  "--cov-report=xml:coverage.xml",
]
testpaths = ["tests"]
pythonpath = ["src"]
norecursedirs = [
  ".git",
  ".hg",
  ".tox",
  "_build",
  "tmp*",
  "env*",
  "benchmark",
  "stress",
]
python_files = ["test_*.py"]
markers = [
  "slow: marks tests as slower integration-style checks",
  "asyncio: marks tests as async",
]

[tool.coverage.run]
branch = true
source = ["src/whoosh", "src/whoosh_modern", "src/whoosh_fastapi", "src/whoosh_admin"]
omit = [
  "*/tests/*",
  "docs/*",
  "benchmark/*",
  "stress/*",
]

[tool.coverage.report]
exclude_lines = [
  "pragma: no cover",
  "def __repr__",
  "raise NotImplementedError",
  "raise ValueError",
  "raise TypeError",
  "raise RuntimeError",
]

[tool.semantic_release]
commit_parser = "conventional"
commit_parser_options = { ignore_merge_commits = true }
commit_message = """\
chore(release): v{version} [skip ci]

Automatically generated by python-semantic-release.
"""
build_command = "python scripts/sync_version.py && uv build"
major_on_zero = true
version_variables = [
  "src/whoosh/__init__.py:__version_string__",
]
version_toml = [
  "pyproject.toml:project.version",
]

[tool.semantic_release.changelog]
exclude_commit_patterns = [
  '''chore(?:\([^)]*?\))?: .+''',
  '''ci(?:\([^)]*?\))?: .+''',
  '''refactor(?:\([^)]*?\))?: .+''',
  '''style(?:\([^)]*?\))?: .+''',
  '''test(?:\([^)]*?\))?: .+''',
  '''build\((?!deps\): .+)''',
  '''^Merge''',
  '''^\d+\.\d+\.\d+''',
]

[tool.semantic_release.branches.master]
match = "^master$"
prerelease = false
prerelease_token = "rc"

[tool.semantic_release.branches.dev]
match = "^dev$"
prerelease = true
prerelease_token = "dev"

[tool.semantic_release.remote]
type = "github"
token = { env = "GH_TOKEN" }

[tool.semantic_release.publish]
upload_to_vcs_release = true
